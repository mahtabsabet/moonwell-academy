<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Moonwell Academy — Vertical Slice</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14121e;
    overflow: hidden;
    touch-action: none;            /* no page scroll/zoom on phones */
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: sans-serif;
  }
  canvas { display: block; }
</style>
</head>
<body>
<!-- Single CDN dependency: the Kaboom.js engine -->
<script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
<script src="assets.js"></script>
<script src="data.js"></script>
<script>
/* ============================================================================
   MOONWELL ACADEMY — VERTICAL SLICE
   A cozy, witchy, tap-to-play life-sim loop in one self-contained file.

   Controls: TAP to move (auto-routes around walls), TAP an object/NPC to walk
   up to it and interact. No D-pad. Mouse click works the same on desktop.

   The 7-step loop:
     1. Wake in the dorm.   2. Attend the herbalism class (learn the recipe).
     3. Forage Lavender in the greenhouse.
     4. Brew the tonic at the classroom cauldron (dedicated brewing screen).
     5. Sell it in the village.   6. Greet a friend in the hall.
     7. Sleep -> day-complete summary.

   ----------------------------------------------------------------------------
   GAME DATA lives in data.js and ART ASSETS in assets.js (both loaded before
   this script). This file holds engine init, state, interactions and rendering.
   ============================================================================ */

  /* GAME DATA & RULES (TILE/ITEMS/ROOMS/RECIPES/CREATURES/SUBJECTS/lunar/maps/...)
     live in data.js, loaded via <script src> before this script. */

  /* ART ASSETS: the `const ASSETS` map of base64 PNG data URIs lives in
     assets.js, loaded via <script src> before this script. To add or swap a
     sprite, set ASSETS[key] there; the renderer auto-swaps sprite-for-
     placeholder when ready(key) is true. */

/* ============================================================================
   ENGINE SETUP — Kaboom is used as a scaling canvas + input + game loop.
   All game state is plain JS; we draw everything ourselves with primitives.
   ============================================================================ */
kaboom({
  width: CANVAS_W,
  height: CANVAS_H,
  background: [20, 18, 30],
  stretch: true,        // scale to fill the screen...
  letterbox: true,      // ...while preserving aspect ratio (bars if needed)
  touchToMouse: true,   // taps register as mouse presses
  crisp: true,          // keep pixels sharp for future pixel-art
  global: true,
});

/* ---------- Handwriting font for the grimoire ----------
   Loaded from a CDN; if it fails the grimoire just uses the default font.
   hf() returns the font name only once it's ready, so text never errors. */
let HAND_READY = false;
try {
  loadFont("hand", "https://cdn.jsdelivr.net/npm/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2")
    .then(() => { HAND_READY = true; }).catch(() => {});
} catch (e) { /* older engine: ignore, fall back to default font */ }
const hf = () => (HAND_READY ? "hand" : undefined);

/* ---------- Sprite loader ----------
   Loads every non-empty ASSETS entry; `ready(key)` is true once it's usable,
   so draws can safely choose sprite-vs-placeholder each frame. */
const READY = new Set();
for (const k in ASSETS) {
  if (!ASSETS[k]) continue;
  loadSprite(k, ASSETS[k]).then(() => READY.add(k)).catch(() => {});
}
const ready = (k) => READY.has(k);

/* Directional walk-cycle frame counts (player_<dir>_w0.. dropped into ASSETS by
   the PixelLab pipeline). The player render cycles these while walking. */
const PLAYER_WALK = {};
for (const d of ["down", "up", "left", "right"]) {
  let n = 0; while (ASSETS["player_" + d + "_w" + n]) n++;
  PLAYER_WALK[d] = n;
}
const WALK_FPS = 9;

/* ---------- Mutable game state ---------- */
let state;
function freshState() {
  return {
    roomId: "dorm",
    inv: { lavender: 0, lavender_calm_tonic: 0 },
    knownRecipes: {},     // recipe id -> true
    skills: {},           // subject id -> level (raised by attending class)
    herbsKnown: {},       // herb id -> true (studied in Herbology)
    crystalsKnown: {},    // crystal id -> true (studied in Crystals)
    creaturesKnown: {},   // creature id -> true (studied in Magical Creatures)
    furniture: {},        // furniture id -> count owned (bought, not yet placed)
    dormDecor: [],         // placed dorm furniture: [{ id, sprite, gx, gy, flat }]
    pots: {},             // herb id -> { stock, readyDay } (greenhouse pots)
    oreNodes: {},         // mine node slot -> { ore, readyDay }
    seeds: {},            // herb id -> count (kept out of the satchel HUD)
    planters: {},         // planter slot -> { herbId, plantedDay } | undefined
    journal: {},          // subject id -> takeaway line (recorded on first lesson)
    coin: 0,
    friendship: 0,
    health: HP_MAX,       // faint at 0 -> infirmary
    energy: EN_MAX,       // magic spends it; food/meditation restore it
    dayCount: 1,          // 1-based; weekday = DAYS[(dayCount-1) % 7]
    attendedToday: {},    // subject id -> true (one lesson per class per day)
    observedToday: false, // charted the moon at the observatory tonight?
    todayLog: [],         // events for tonight's recap
    flags: { metFriend: false },
  };
}
function newGame() {
  state = freshState();
  player = { px: 0, py: 0, gx: 5, gy: 9, dir: "up" };
  path = [];
  pendingAction = null;
  pendingDoor = null;
  dialogue = null;       // { lines:[...], idx }
  toastMsg = null;       // { text, until }
  brewUI = null;         // { contents:[ids], grimoireOpen, msg }
  journalOpen = false;   // Book of Shadows overlay
  introLetter = true;    // invitation letter (shown once at the start)
  showTimetable = false; // timetable overlay
  nightSummary = false;  // nightly recap (sleep)
  shopOpen = false;      // merchant shop overlay
  plantMenu = null;      // { slot } — choose a seed to plant
  encounter = null;      // { slot, creature } — mine creature encounter
  bagOpen = false;       // bag / self-care overlay
  meditating = null;     // { start, from } — grounding meditation
  decorating = null;     // { sel } — dorm decorating mode
  syncGreenhousePots();  // start with no pots (none studied yet)
  placePlayer(5, 9, "up");
  save();                // persist the fresh game
}

let player, path, pendingAction, pendingDoor, dialogue, toastMsg, brewUI, journalOpen, bosPage = 0;
let introLetter, showTimetable, nightSummary, shopOpen, plantMenu, encounter, bagOpen, meditating, decorating, shopPage = 0, resetArmed = false;
const weekday = () => DAYS[(state.dayCount - 1) % DAYS.length];

/* ---------- Save / load (localStorage) ---------- */
const SAVE_KEY = "moonwell_save_v1";
function save() {
  try {
    const snap = JSON.parse(JSON.stringify(state));
    // include any herbs currently steeping so a mid-brew save never loses them
    if (brewUI && brewUI.contents) for (const id of brewUI.contents)
      if (ITEMS[id] && ITEMS[id].kind === "herb") snap.inv[id] = (snap.inv[id] || 0) + 1;
    localStorage.setItem(SAVE_KEY, JSON.stringify({ state: snap, p: { gx: player.gx, gy: player.gy, dir: player.dir } }));
  } catch (e) { /* storage unavailable (private mode etc.) — ignore */ }
}
// Boot: restore a save if present, else start a new game.
function bootGame() {
  let data = null;
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) data = JSON.parse(raw); } catch (e) { data = null; }
  if (!data || !data.state) { newGame(); return; }
  state = Object.assign(freshState(), data.state);   // fill any missing keys with defaults
  // transient (never saved)
  player = { px: 0, py: 0, gx: 5, gy: 9, dir: "down" };
  path = []; pendingAction = null; pendingDoor = null;
  dialogue = null; toastMsg = null; brewUI = null; journalOpen = false; bosPage = 0;
  introLetter = false; showTimetable = false; nightSummary = false; shopOpen = false; plantMenu = null; encounter = null; bagOpen = false; meditating = null; decorating = null;
  syncGreenhousePots();
  const p = data.p || { gx: 5, gy: 9, dir: "down" };
  state.roomId = state.roomId || "dorm";
  placePlayer(p.gx, p.gy, p.dir);
}
// Wipe the save and start over (used by the Reset button).
function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  resetArmed = false;
  newGame();
}

/* ---------- Tiny helpers ---------- */
const room   = () => ROOMS[state.roomId];
const cx     = (gx) => gx * TILE + TILE / 2;
const cy     = (gy) => ORIGIN_Y + gy * TILE + TILE / 2;
const keyOf  = (x, y) => x + "," + y;
const doorAt = (r, x, y) => r.doors.find((d) => d.gx === x && d.gy === y);
const interAt = (r, x, y) => r.inters.find((o) => o.gx === x && o.gy === y);
const decorAt = (r, x, y) => (r.decor || []).find((o) => o.gx === x && o.gy === y);

function placePlayer(gx, gy, dir) {
  player.gx = gx; player.gy = gy;
  player.px = cx(gx); player.py = cy(gy);
  if (dir) player.dir = dir;
}

function loadRoom(id, gx, gy) {
  state.roomId = id;
  path = []; pendingAction = null; pendingDoor = null;
  placePlayer(gx, gy);
}

function toast(text) {
  toastMsg = { text, until: time() + 2.4 };
}

function startDialogue(lines) {
  dialogue = { lines, idx: 0 };
}

/* ---------- Pathfinding (BFS on the tile grid) ---------- */
function walkable(r, x, y) {
  if (x < 0 || y < 0 || x >= GW || y >= GH) return false;
  if (doorAt(r, x, y)) return true;        // doors are always walkable
  if (r.grid[y][x] === "#") return false;  // walls block
  if (interAt(r, x, y)) return false;      // props/NPCs are solid
  const dc = decorAt(r, x, y);             // decor blocks unless solid:false
  if (dc && dc.solid !== false) return false;
  return true;
}

// Returns the list of tiles AFTER the start tile leading to the nearest goal,
// or null if unreachable. `goals` is an array of {x,y}.
function bfs(r, sx, sy, goals) {
  const goalSet = new Set(goals.map((g) => keyOf(g.x, g.y)));
  const startK = keyOf(sx, sy);
  if (goalSet.has(startK)) return [];      // already on a goal tile
  const prev = {};
  const visited = new Set([startK]);
  const queue = [{ x: sx, y: sy }];
  const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  while (queue.length) {
    const cur = queue.shift();
    for (const [dx, dy] of dirs) {
      const nx = cur.x + dx, ny = cur.y + dy;
      const k = keyOf(nx, ny);
      if (visited.has(k) || !walkable(r, nx, ny)) continue;
      visited.add(k);
      prev[k] = cur;
      if (goalSet.has(k)) {
        // reconstruct path
        const out = [];
        let node = { x: nx, y: ny };
        while (keyOf(node.x, node.y) !== startK) {
          out.unshift(node);
          node = prev[keyOf(node.x, node.y)];
        }
        return out;
      }
      queue.push({ x: nx, y: ny });
    }
  }
  return null;
}

// Walkable neighbours of a (solid) interactable, used as goal tiles.
function neighborGoals(r, x, y) {
  return [[0, -1], [0, 1], [-1, 0], [1, 0]]
    .map(([dx, dy]) => ({ x: x + dx, y: y + dy }))
    .filter((g) => walkable(r, g.x, g.y));
}

// Build a movement path to `goals`, remembering any pending door/action.
function navigate(goals, pending) {
  const r = room();
  const moving = path.length > 0;
  const start = moving ? path[0] : { x: player.gx, y: player.gy };
  const bp = bfs(r, start.x, start.y, goals);
  if (!bp) return false;                    // unreachable: ignore the tap
  pendingAction = pending.action || null;
  pendingDoor   = pending.door   || null;
  // If mid-step, finish reaching the tile we're already walking toward.
  path = (moving ? [path[0]] : []).concat(bp);
  if (path.length === 0) onArrive();         // already standing on the goal
  return true;
}

function faceToward(o) {
  const dx = o.gx - player.gx, dy = o.gy - player.gy;
  if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? "right" : "left";
  else player.dir = dy > 0 ? "down" : "up";
}

/* ---------- Arrival: fire whatever the tap queued up ---------- */
function onArrive() {
  if (pendingAction) {
    const o = pendingAction; pendingAction = null;
    faceToward(o);
    doAction(o);
  }
  if (pendingDoor) {
    const d = pendingDoor; pendingDoor = null;
    if (d.gate && !passGate(d.gate)) return;   // blocked — passGate shows why
    const src = state.roomId;
    loadRoom(d.to, d.atGx, d.atGy);
    // face into the new room (away from the door we just came through)
    const back = ROOMS[d.to].doors.find((b) => b.to === src);
    if (back) {
      const dx = d.atGx - back.gx, dy = d.atGy - back.gy;
      player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    }
  }
}

/* ---------- Interactions ---------- */
function doAction(o) { dispatchAction(o); save(); }
function dispatchAction(o) {
  switch (o.action) {
    case "class":   return actClass(o.subject);
    case "forage":  return actForage(o);
    case "brew":    return actBrew();
    case "shop":    return actShop(o);
    case "planter": return actPlanter(o);
    case "mine":    return actMine(o);
    case "friend":  return actFriend();
    case "sleep":   return actSleep();
    case "journal": return actJournal();
    case "timetable": return actTimetable();
    case "observe": return actObserve();
    case "decorate": return actDecorate();
  }
}

// Open the dorm decorating mode: pick owned furniture from the palette, tap a
// tile to place it; tap a placed piece to select it, then rotate / remove /
// move it. Cosmetic only — placed pieces never block walking.
function actDecorate() { decorating = { sel: null, pick: null, page: 0 }; }

// Chart the moon at the observatory: read tonight's phase and its meaning.
function actObserve() {
  const p = moonPhase();
  if (state.observedToday) {
    startDialogue([{ s: "Telescope", t: "Tonight's moon is " + p.name + ". You've already charted the sky." }]);
    return;
  }
  state.observedToday = true;
  state.todayLog.push("Charted the " + p.name);
  startDialogue([
    { s: "Prof. Vega", t: "Look — tonight is the " + p.name + "." },
    { s: "Prof. Vega", t: p.mean },
    { s: "Prof. Vega", t: moonWaxing() ? "The light is growing — a fine time to begin and to gather growing herbs."
                                       : (moonIllum() > 0.98 ? "At the full, psychic and divinatory work is strongest."
                                                             : "The light is fading — a time to release, banish, and rest.") },
  ]);
}

// Attend a class — but only on its scheduled day, once per day. Herbology
// teaches one plant per visit; other classes grant a skill + journal takeaway.
function actClass(id) {
  const s = SUBJECTS[id];
  if (!s) return;
  // day gate
  if (!(TIMETABLE[weekday()] || []).includes(id)) {
    const days = subjectDays(id).join(" & ") || "another term";
    startDialogue([{ s: s.teacher, t: s.name + " meets on " + days + ". Come back then!" }]);
    return;
  }
  // one lesson per class per day
  if (state.attendedToday[id]) {
    startDialogue([{ s: s.teacher, t: "That's enough " + s.name + " for today. Rest, and return another day." }]);
    return;
  }
  state.attendedToday[id] = true;
  if (id === "herbology") return teachHerb();
  if (id === "crystals")  return teachCrystal();
  if (id === "creatures") return teachCreature();
  if (id === "potions")   { teachRecipe(); }   // Potions also grants a recipe
  const first = !state.skills[id];
  state.skills[id] = (state.skills[id] || 0) + 1;
  if (first) {
    state.journal[id] = s.takeaway;
    state.todayLog.push("Studied " + s.name);
    if (id !== "potions") startDialogue(s.lesson);  // potions speaks via teachRecipe
  } else if (id !== "potions") {
    startDialogue(s.review || [{ s: s.teacher, t: "Remember: " + s.takeaway }]);
  }
}

// Potions: teach the next recipe whose herbs you've already studied.
function teachRecipe() {
  const next = RECIPE_ORDER.find((rid) => {
    if (state.knownRecipes[rid]) return false;
    return Object.keys(RECIPES[rid].needs).every((ing) =>
      ITEMS[ing].kind !== "herb" || state.herbsKnown[ing]);
  });
  if (!next) {
    const blocked = RECIPE_ORDER.some((rid) => !state.knownRecipes[rid]);
    startDialogue([{ s: "Prof. Hollis", t: blocked
      ? "To learn more brews, study their herbs in Herbology first."
      : "You know every recipe this term — now practice makes the potion." }]);
    return;
  }
  state.knownRecipes[next] = true;
  const r = RECIPES[next];
  state.todayLog.push("Learned the " + r.name);
  startDialogue([
    { s: "Prof. Hollis", t: "Today we brew the " + r.name + "." },
    { s: "Prof. Hollis", t: r.method },
    { s: "Prof. Hollis", t: "It's noted in your grimoire. " + r.does },
  ]);
}

// Herbology: teach the next unstudied plant, adding its Book of Shadows page.
function teachHerb() {
  const next = HERB_ORDER.find((h) => !state.herbsKnown[h]);
  if (!next) {
    startDialogue([{ s: "Prof. Sage", t: "You've studied all this term's plants — revisit them in your Book of Shadows." }]);
    return;
  }
  state.herbsKnown[next] = true;
  state.skills.herbology = Object.keys(state.herbsKnown).length;
  state.journal.herbology = "Studying the garden — " + state.skills.herbology + " of " + HERB_ORDER.length + " plants learned.";
  if (next === "lavender") state.knownRecipes["calm_tonic"] = true;  // bootstrap the first brew
  state.pots[next] = { stock: POT_FULL, readyDay: state.dayCount };  // a fresh pot appears
  syncGreenhousePots();
  state.todayLog.push("Learned " + ITEMS[next].name);
  startDialogue(ITEMS[next].lesson);
}

// Crystals: study the next stone, add its Book of Shadows page + a sample stone.
function teachCrystal() {
  const next = CRYSTAL_ORDER.find((c) => !state.crystalsKnown[c]);
  if (!next) {
    startDialogue([{ s: "Prof. Beryl", t: "You've studied all this term's stones — revisit them in your Book of Shadows." }]);
    return;
  }
  state.crystalsKnown[next] = true;
  state.skills.crystals = Object.keys(state.crystalsKnown).length;
  state.journal.crystals = "Studying the stones — " + state.skills.crystals + " of " + CRYSTAL_ORDER.length + " learned.";
  state.inv[next] = (state.inv[next] || 0) + 1;   // a sample stone for your bag
  state.todayLog.push("Studied " + ITEMS[next].name + " (+1 stone)");
  startDialogue(ITEMS[next].lesson);
}

// Magical Creatures: study the next creature, adding a Book of Shadows bestiary
// entry and revealing how to settle it in the mines.
function teachCreature() {
  const next = CREATURE_ORDER.find((c) => !state.creaturesKnown[c]);
  if (!next) {
    startDialogue([{ s: "Keeper Fenn", t: "You've met every beast on the syllabus — revisit them in your Book of Shadows." }]);
    return;
  }
  state.creaturesKnown[next] = true;
  state.skills.creatures = Object.keys(state.creaturesKnown).length;
  state.journal.creatures = "Studying the bestiary — " + state.skills.creatures + " of " + CREATURE_ORDER.length + " known.";
  state.todayLog.push("Studied the " + CREATURES[next].name);
  startDialogue(CREATURES[next].lesson);
}

/* ---------- Greenhouse pots ---------- */
// Rebuild the greenhouse interactables: Prof. Sage + one pot per studied herb.
function syncGreenhousePots() {
  const pots = HERB_ORDER.filter((id) => state.herbsKnown[id]).map((id) => {
    const slot = POT_SLOTS[HERB_ORDER.indexOf(id)];
    return { gx: slot[0], gy: slot[1], kind: "herb", name: ITEMS[id].name,
             color: ITEMS[id].color, action: "forage", herbId: id };
  });
  ROOMS.greenhouse.inters = GH_BASE.concat(pots);
}
// Lazily refill a pot once its regrowth day arrives.
function refreshPot(id) {
  const p = state.pots[id];
  if (p && p.stock <= 0 && state.dayCount >= p.readyDay) p.stock = POT_FULL;
}
// Is it this herb's ideal gathering moon? (waxing for growers, full for psychics)
function isIdealMoon(id) {
  const m = HERB_MOON[id];
  if (m === "Full") return moonPhase().name === "Full Moon";
  if (m === "Waxing") return moonWaxing();
  return false;
}

/* ---------- Mining ---------- */
const mineDepth = () => (ROOMS[state.roomId] && ROOMS[state.roomId].depth) || 1;
const nodeKey = (o) => state.roomId + "#" + o.nodeSlot;   // ore state is per room + slot
function refreshNode(key) {
  const n = state.oreNodes[key];
  if (n && n.ore <= 0 && state.dayCount >= n.readyDay) n.ore = ORE_PER;
}
// Weighted random stone; deeper levels and higher Mining skill favour rarer stones.
function mineDrop(depth) {
  const lvl = state.skills.mining || 0, d = depth || 1;
  const weighted = ORE_TABLE.map(([id, w], i) => [id, i < 3 ? w : w + (d - 1) * 8 + lvl * 0.6]);
  const total = weighted.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [id, w] of weighted) { if ((r -= w) <= 0) return id; }
  return weighted[0][0];
}
function actMine(o) {
  if ((state.inv.pickaxe || 0) <= 0) {
    toast("You need a pickaxe — buy one at Magical Tools.");
    return;
  }
  const key = nodeKey(o);
  if (!state.oreNodes[key]) state.oreNodes[key] = { ore: ORE_PER, readyDay: state.dayCount };
  refreshNode(key);
  const n = state.oreNodes[key];
  if (n.ore <= 0) { toast("This seam is spent — back in " + Math.max(0, n.readyDay - state.dayCount) + "d."); return; }
  const depth = mineDepth();
  // a creature may interrupt; resolve it before the ore is won (likelier deeper)
  if (Math.random() < ENCOUNTER_CHANCE + (depth - 1) * 0.1) {
    const pool = CREATURES_BY_DEPTH[depth] || CREATURES_BY_DEPTH[1];
    encounter = { key, depth, creature: pool[Math.floor(Math.random() * pool.length)] };
    return;
  }
  doMineYield(key, depth);
}
// Win the ore from a node: consume an ore, give a stone, raise Mining.
function doMineYield(key, depth) {
  const n = state.oreNodes[key];
  if (!n || n.ore <= 0) return;
  n.ore -= 1;
  if (n.ore <= 0) n.readyDay = state.dayCount + ORE_REGROW;
  const id = mineDrop(depth);
  state.inv[id] = (state.inv[id] || 0) + 1;
  state.skills.mining = (state.skills.mining || 0) + 1;
  state.todayLog.push("Mined " + ITEMS[id].name);
  toast("Struck " + ITEMS[id].name + "!");
  save();
}
// First held item of a given kind (for the offer/light approaches).
function firstOfKind(kind) { return Object.keys(state.inv).find((id) => state.inv[id] > 0 && ITEMS[id] && ITEMS[id].kind === kind); }
// Resolve a creature encounter with a chosen defensive approach. Never harmful.
function resolveEncounter(approachId) {
  const e = encounter, c = CREATURES[e.creature];
  const a = APPROACHES.find((x) => x.id === approachId);
  if (a && a.magic && state.energy < SPELL_COST) { toast("Too tired to cast — rest, eat, or back away."); return; }
  encounter = null;
  if (approachId === "retreat") { toast("You back away and leave the seam be."); return; }
  if (a && a.magic) state.energy = Math.max(0, state.energy - SPELL_COST);  // magic spends energy
  // food/candle are consumed; the flute is an instrument you keep
  if (approachId === "offer") { const f = firstOfKind("fruit"); if (f) state.inv[f] -= 1; }
  if (approachId === "light") { if ((state.inv.candle || 0) > 0) state.inv.candle -= 1; }
  const best = approachId === c.calmWith;
  if (best) {
    if (c.drop === "stone") { const s = mineDrop(e.depth); state.inv[s] = (state.inv[s] || 0) + 1; }
    else if (c.drop) { state.inv[c.drop] = (state.inv[c.drop] || 0) + 1; }
    toast(c.best);
    doMineYield(e.key, e.depth);
  } else {
    // it wasn't settled — the creature gets a hit in (lessened by your wards)
    const dmg = Math.max(2, creatureBite(c) - defense());
    state.health = Math.max(0, state.health - dmg);
    if (state.health <= 0) { faint(); return; }
    toast(c.ok + "  (-" + dmg + " health)");
    doMineYield(e.key, e.depth);   // you push through and still work the seam
  }
  save();
}
// Pass out and wake in the infirmary, drained.
function faint() {
  encounter = null;
  state.health = 15; state.energy = 0;
  loadRoom("infirmary", 5, 9);
  startDialogue([{ s: "Nurse Bramble", t: "Easy now — you fainted in the mines. Rest here, eat something, and don't push so hard." }]);
  save();
}

// Open the Book of Shadows (overview + a page per studied herb).
function actJournal() { journalOpen = true; bosPage = 0; resetArmed = false; }
// Reset button rect (overview page of the Book of Shadows).
function resetBtn() { return { x: CANVAS_W / 2 - 70, y: 404, w: 140, h: 24 }; }

// Tapping the dorm timetable shows the weekly schedule.
function actTimetable() { showTimetable = true; }

// Pick from a greenhouse pot. Yields 2 on the herb's ideal moon (double
// harvest), else 1. Emptying the pot starts its regrowth timer.
function actForage(o) {
  const id = (o && o.herbId) || "lavender";
  refreshPot(id);
  const pot = state.pots[id];
  const nm = ITEMS[id].name;
  if (!pot || pot.stock <= 0) {
    const d = pot ? Math.max(0, pot.readyDay - state.dayCount) : REGROW_DAYS;
    toast("The " + nm + " pot is bare — regrows in " + d + "d.");
    return;
  }
  const ideal = isIdealMoon(id);
  const yld = ideal ? 2 : 1;
  state.inv[id] = (state.inv[id] || 0) + yld;
  pot.stock -= 1;
  if (pot.stock <= 0) pot.readyDay = state.dayCount + REGROW_DAYS;
  const gotSeed = Math.random() < SEED_DROP_CHANCE;   // sometimes a seed too
  if (gotSeed) state.seeds[id] = (state.seeds[id] || 0) + 1;
  state.todayLog.push("Picked " + yld + " " + nm + (ideal ? " (ideal moon)" : ""));
  toast("Picked " + yld + " " + nm + (ideal ? " — double, ideal moon!" : "") + (gotSeed ? " (+seed)" : ""));
}

/* ---------- Herb Garden: planting & harvesting ---------- */
function actPlanter(o) {
  const slot = o.planterSlot, pl = state.planters[slot];
  if (!pl) {                                    // empty -> plant a seed
    if (!Object.keys(state.seeds).some((id) => state.seeds[id] > 0)) {
      toast("No seeds — buy them from the merchant or find them foraging.");
      return;
    }
    plantMenu = { slot };
    return;
  }
  const age = state.dayCount - pl.plantedDay;
  if (age < GROW_DAYS) { toast(ITEMS[pl.herbId].name + " is still growing — " + (GROW_DAYS - age) + "d left."); return; }
  // ripe -> harvest (tended beds are generous; double on the ideal moon)
  const ideal = isIdealMoon(pl.herbId);
  const yld = ideal ? 4 : 2;
  state.inv[pl.herbId] = (state.inv[pl.herbId] || 0) + yld;
  const gotSeed = Math.random() < 0.5;
  if (gotSeed) state.seeds[pl.herbId] = (state.seeds[pl.herbId] || 0) + 1;
  state.todayLog.push("Harvested " + yld + " " + ITEMS[pl.herbId].name);
  toast("Harvested " + yld + " " + ITEMS[pl.herbId].name + (ideal ? " — ideal moon!" : "") + (gotSeed ? " (+seed)" : ""));
  state.planters[slot] = undefined;
}
function plantSeed(slot, id) {
  if ((state.seeds[id] || 0) <= 0) return;
  state.seeds[id] -= 1;
  state.planters[slot] = { herbId: id, plantedDay: state.dayCount };
  plantMenu = null;
  toast("Planted " + ITEMS[id].name + " — ready in " + GROW_DAYS + "d.");
  save();
}

/* ---------- Merchant shop (buy seeds, sell goods) ---------- */
function actShop(o) { shopOpen = (o && o.shop) || "general"; shopPage = 0; }
function buySeed(id) {
  if (state.coin < SEED_COST) { toast("Not enough coin."); return; }
  state.coin -= SEED_COST;
  state.seeds[id] = (state.seeds[id] || 0) + 1;
  toast("Bought a " + ITEMS[id].name + " seed.");
  save();
}
function buyItem(id) {
  const cost = buyCost(id);
  if (state.coin < cost) { toast("Not enough coin."); return; }
  state.coin -= cost;
  if (ITEMS[id].kind === "furniture") {
    state.furniture[id] = (state.furniture[id] || 0) + 1;   // goes to your furniture stash, not the satchel
    toast("Bought " + ITEMS[id].name + " — place it from your dorm (Decorate).");
  } else {
    state.inv[id] = (state.inv[id] || 0) + 1;
    toast("Bought " + ITEMS[id].name + ".");
  }
  save();
}
function sellItem(id) {
  if ((state.inv[id] || 0) <= 0) return;
  const price = ITEMS[id].sell != null ? ITEMS[id].sell : HERB_SELL;
  state.inv[id] -= 1;
  state.coin += price;
  state.todayLog.push("Sold a " + ITEMS[id].name + " (+" + price + ")");
  save();
}

// Tapping the cauldron opens the dedicated brewing screen.
function actBrew() {
  brewUI = { contents: [], grimoireOpen: false, heat: "med", msg: "Add ingredients, set the flame, then Brew." };
  if (!Object.keys(state.knownRecipes).length) {
    brewUI.msg = "You know no recipes yet — learn them in Herbology & Potions.";
  }
}


function actFriend() {
  const first = !state.flags.metFriend;
  state.flags.metFriend = true;
  state.friendship += 1;
  if (first) state.todayLog.push("Met Robin");
  startDialogue(first ? DIALOGUE.friend_first : DIALOGUE.friend_again);
}

// Sleep -> nightly recap, but only once today's scheduled classes are attended.
function actSleep() {
  const missed = (TIMETABLE[weekday()] || []).filter((id) => !state.attendedToday[id]);
  if (missed.length) {
    const names = missed.map((id) => SUBJECTS[id].name).join(" and ");
    toast("Not yet — you still have " + names + " today.");
    return;
  }
  nightSummary = true;
}

function advanceDay() {
  nightSummary = false;
  state.dayCount += 1;
  state.attendedToday = {};
  state.observedToday = false;
  state.todayLog = [];
  state.health = HP_MAX; state.energy = EN_MAX;   // a night's rest restores you
  for (const id in state.pots) refreshPot(id);   // pots regrow overnight
  for (const k in state.oreNodes) refreshNode(k); // ore seams replenish
  loadRoom("dorm", 5, 9);   // wake up at home
  toast("Day " + state.dayCount + " — " + weekday() + ". Good morning!");
  save();
}

/* ---------- Brewing screen logic ----------
   Spring Water comes free from the cauldron's pantry; herbs come from your bag
   and are returned if you empty the pot or leave, so brewing is never a loss. */
function countMap(arr) {
  const m = {};
  for (const id of arr) m[id] = (m[id] || 0) + 1;
  return m;
}
function sameCounts(a, b) {
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => a[k] === b[k]);
}

// Ingredients you can drop into the pot right now.
function pantry() {
  const list = [{ id: "spring_water", n: Infinity }, { id: "oil", n: Infinity }, { id: "salt", n: Infinity }]; // always at the cauldron
  if (moonPhase().name === "Full Moon") list.push({ id: "moon_water", n: Infinity }); // only at the full moon
  for (const id in state.inv) {
    if (ITEMS[id].kind === "herb" && state.inv[id] > 0) list.push({ id, n: state.inv[id] });
  }
  return list;
}

function brewAdd(id) {
  if (brewUI.contents.length >= 6) { brewUI.msg = "The cauldron is full."; return; }
  if (ITEMS[id].kind === "herb") {
    if ((state.inv[id] || 0) <= 0) return;
    state.inv[id] -= 1;            // herbs are spent into the pot
  }
  brewUI.contents.push(id);
  brewUI.msg = "Added " + ITEMS[id].name + ".";
}

function brewReturnContents() {
  for (const id of brewUI.contents) {
    if (ITEMS[id].kind === "herb") state.inv[id] = (state.inv[id] || 0) + 1;
  }
  brewUI.contents = [];
}

function brewAttempt() {
  if (brewUI.contents.length === 0) { brewUI.msg = "Add some ingredients first."; return; }
  const cc = countMap(brewUI.contents);
  const matchId = Object.keys(RECIPES).find((rid) => sameCounts(cc, RECIPES[rid].needs));
  if (matchId && state.knownRecipes[matchId]) {
    const r = RECIPES[matchId];
    if (brewUI.heat !== r.heat) {                 // right mix, wrong flame
      brewReturnContents();
      brewUI.msg = HEATS.indexOf(brewUI.heat) < HEATS.indexOf(r.heat)
        ? "Too gentle — raise the flame (it needs to " + heatWord(r.heat) + ")."
        : "Too fierce — it scorches. Lower the flame (it needs to " + heatWord(r.heat) + ").";
      return;
    }
    const mk = r.makes;
    brewUI.contents = [];          // consumed (herbs already removed from bag)
    state.inv[mk] = (state.inv[mk] || 0) + 1;
    state.energy = Math.max(0, state.energy - BREW_COST);   // brewing is magic; it tires you a little
    state.todayLog.push("Brewed a " + ITEMS[mk].name);
    brewUI.msg = "Success — a " + ITEMS[mk].fullName + "!";
    save();
  } else if (matchId) {
    brewReturnContents();          // right mix, but not yet taught
    brewUI.msg = "These do combine... but you've not learned this recipe yet.";
  } else {
    brewReturnContents();          // no failure punishment — ingredients returned
    brewUI.msg = "It fizzles softly. Check your grimoire and try again.";
  }
}

function brewLeave() {
  brewReturnContents();
  brewUI = null;
}

// Per-herb plant sprite (falls back to the generic lavender plant).
function herbSprite(id) { return ready("herb_" + id) ? "herb_" + id : "herb"; }
// Inventory icon for an item: its own icon, else the plant sprite for herbs.
function itemIcon(id) {
  if (ready("item_" + id)) return "item_" + id;
  if (ITEMS[id] && ITEMS[id].kind === "herb" && ready("herb_" + id)) return "herb_" + id;
  return null;
}
// Total defense from carried wards (used by the future combat layer).
function defense() {
  let d = 0;
  for (const id in state.inv) if (ITEMS[id] && ITEMS[id].defense) d += ITEMS[id].defense * state.inv[id];
  return d;
}

/* ---------- Objective hint (gentle, cozy guidance) ---------- */
function hintText() {
  const classes = TIMETABLE[weekday()] || [];
  if (!classes.length) return "Free day — forage, brew, sell, or visit Robin. Sleep to move on.";
  const remaining = classes.filter((id) => !state.attendedToday[id]).map((id) => SUBJECTS[id].name);
  if (remaining.length) return "Attend today: " + remaining.join(", ") + ".";
  return "Classes done — forage, brew, or rest when you're ready.";
}

/* ============================================================================
   INPUT — one tap handler for the whole game.
   ============================================================================ */
onMousePress(() => {
  const m = mousePos();

  if (introLetter)   { introLetter = false; showTimetable = true; return; } // letter -> timetable
  if (showTimetable) { showTimetable = false; return; }
  if (nightSummary)  { advanceDay(); return; }         // sleep recap -> next day
  if (shopOpen)   { handleShopTap(m); return; }        // merchant shop owns taps
  if (plantMenu)  { handlePlantTap(m); return; }       // seed chooser owns taps
  if (encounter)  { handleEncounterTap(m); return; }   // mine creature owns taps
  if (meditating) return;                              // sit still and meditate
  if (bagOpen)    { handleBagTap(m); return; }         // bag / self-care owns taps
  if (journalOpen) { handleBosTap(m); return; }        // Book of Shadows owns taps
  if (dialogue) {                                      // tap advances dialogue
    dialogue.idx += 1;
    if (dialogue.idx >= dialogue.lines.length) dialogue = null;
    return;
  }
  if (brewUI) { handleBrewTap(m); return; }            // brewing screen owns taps
  if (decorating) { handleDecorateTap(m); return; }    // dorm decorating owns taps
  if (m.y < ORIGIN_Y) { if (m.y >= 34) bagOpen = true; return; }   // tap the satchel/vitals -> Bag

  const gx = Math.floor(m.x / TILE);
  const gy = Math.floor((m.y - ORIGIN_Y) / TILE);
  if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return;

  const r = room();

  // 1) tapped an NPC / object -> walk adjacent, then interact
  const obj = interAt(r, gx, gy);
  if (obj) {
    const goals = neighborGoals(r, gx, gy);
    if (goals.length) navigate(goals, { action: obj });
    return;
  }
  // 2) tapped a door -> walk onto it, then change rooms
  const door = doorAt(r, gx, gy);
  if (door) { navigate([{ x: gx, y: gy }], { door }); return; }
  // 3) tapped open floor -> just walk there
  if (walkable(r, gx, gy)) navigate([{ x: gx, y: gy }], {});
});

/* ============================================================================
   MOVEMENT — advance the player along the current path each frame.
   ============================================================================ */
onUpdate(() => {
  if (dialogue || brewUI || journalOpen || introLetter || showTimetable || nightSummary || shopOpen || plantMenu || encounter || bagOpen || meditating || decorating || path.length === 0) return;
  const t = path[0];
  const tx = cx(t.x), ty = cy(t.y);
  const dx = tx - player.px, dy = ty - player.py;
  const len = Math.hypot(dx, dy);
  const step = SPEED * dt();
  if (len <= step || len === 0) {
    player.px = tx; player.py = ty;
    player.gx = t.x; player.gy = t.y;
    path.shift();
    if (path.length === 0) onArrive();
  } else {
    const nx = dx / len, ny = dy / len;
    player.px += nx * step;
    player.py += ny * step;
    if (Math.abs(nx) > Math.abs(ny)) player.dir = nx > 0 ? "right" : "left";
    else player.dir = ny > 0 ? "down" : "up";
  }
});

/* ============================================================================
   RENDERING — drawn every frame from game state with Kaboom primitives.
   (Swap any drawRect below for drawSprite to drop in pixel-art PNGs.)
   ============================================================================ */
const col = (a, mul = 1) => rgb(a[0] * mul, a[1] * mul, a[2] * mul);
const pulse = () => 0.5 + 0.5 * Math.sin(time() * 4);

// Draw the current moon phase as a disc; `bg` (the backdrop colour behind it)
// is used for the shadow that carves out the crescent/gibbous shape.
function drawMoon(cxp, cyp, R, bg) {
  drawCircle({ pos: vec2(cxp, cyp), radius: R, color: rgb(238, 236, 214) });
  drawCircle({ pos: vec2(cxp - R * 0.32, cyp - R * 0.2), radius: R * 0.13, color: rgb(214, 212, 190) });
  drawCircle({ pos: vec2(cxp + R * 0.28, cyp + R * 0.26), radius: R * 0.17, color: rgb(214, 212, 190) });
  const illum = moonIllum();
  if (illum < 0.985) {
    // shadow disc sits ON the moon at new (illum 0) and slides clear by full
    // (illum 1); it offsets toward the dark side so the lit limb faces correctly.
    const shift = (moonWaxing() ? -1 : 1) * illum * 2 * R;
    drawCircle({ pos: vec2(cxp + shift, cyp), radius: R + 1, color: rgb(bg[0], bg[1], bg[2]) });
  }
}

onDraw(() => {
  const r = room();

  // --- floor + walls (sprite if supplied, else colored placeholder) ---
  // Many rooms share a tile theme (see TILE_THEME); fall back to the room id.
  const theme = TILE_THEME[state.roomId] || state.roomId;
  const floorKey = "floor_" + theme, wallKey = "wall_" + theme;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const isWall = r.grid[y][x] === "#";
      const key = isWall ? wallKey : floorKey;
      const pos = vec2(x * TILE, ORIGIN_Y + y * TILE);
      if (ready(key)) {
        drawSprite({ sprite: key, pos, width: TILE, height: TILE });
      } else {
        const shade = ((x + y) % 2 === 0) ? 1 : 0.92;   // subtle checker
        drawRect({ pos, width: TILE, height: TILE, color: isWall ? col(r.floor, 0.45) : col(r.floor, shade) });
      }
    }
  }

  // --- observatory night sky + the live moon ---
  if (state.roomId === "observatory") {
    const sky = [20, 22, 44];
    drawRect({ pos: vec2(0, ORIGIN_Y), width: CANVAS_W, height: 100, color: rgb(sky[0], sky[1], sky[2]) });
    for (let i = 0; i < 18; i++) {                      // a scatter of stars
      const sx = (i * 73 % CANVAS_W), sy = ORIGIN_Y + (i * 137 % 88) + 6;
      drawCircle({ pos: vec2(sx, sy), radius: 1, color: rgb(220, 225, 255), opacity: 0.6 });
    }
    drawMoon(CANVAS_W / 2, ORIGIN_Y + 46, 28, sky);
    drawText({ text: moonPhase().name, pos: vec2(CANVAS_W / 2, ORIGIN_Y + 86), size: 10,
               color: rgb(220, 220, 245), anchor: "center" });
  }

  // --- doors (walkable; labelled with destination) ---
  for (const d of r.doors) {
    const pos = vec2(d.gx * TILE, ORIGIN_Y + d.gy * TILE);
    if (ready("door")) {
      drawSprite({ sprite: "door", pos, width: TILE, height: TILE });
    } else {
      drawRect({ pos, width: TILE, height: TILE, color: rgb(95, 82, 145),
                 outline: { color: rgb(150, 135, 210), width: 1 + pulse() * 1.5 } });
    }
    drawText({
      text: d.label, pos: vec2(cx(d.gx), cy(d.gy)),
      size: 8, color: rgb(235, 230, 255), anchor: "center", width: TILE,
    });
  }

  // --- decor (non-interactive). flat lies on the floor; others stand up ---
  for (const o of (r.decor || [])) {
    if (!ready(o.kind)) continue;
    const s = o.size || PROP_DRAW;
    if (o.flat) {
      drawSprite({ sprite: o.kind, anchor: "center", pos: vec2(cx(o.gx), cy(o.gy)), width: s, height: s });
    } else {
      drawSprite({ sprite: o.kind, anchor: "bot", pos: vec2(cx(o.gx), ORIGIN_Y + (o.gy + 1) * TILE), width: s, height: s });
    }
  }

  // --- placed dorm furniture (cosmetic; only in the dorm) ---
  if (r === ROOMS.dorm) (state.dormDecor || []).forEach(drawPlacedDecor);

  // --- interactables (NPCs / props) with a gentle "tappable" glow ---
  for (const o of r.inters) {
    const p = pulse();

    // garden planters: soil bed; show seedling growth -> ripe crop
    // mine ore nodes: a rock with gleaming ore; depletes and replenishes
    if (o.nodeSlot !== undefined) {
      const _k = nodeKey(o);
      refreshNode(_k);
      const n = state.oreNodes[_k];
      const ore = n ? n.ore : ORE_PER;
      const live = ore > 0;
      const daysLeft = n ? Math.max(0, n.readyDay - state.dayCount) : 0;
      drawRect({ pos: vec2(cx(o.gx), ORIGIN_Y + o.gy * TILE + TILE / 2), width: TILE - 8, height: TILE - 10, anchor: "center",
                 color: live ? rgb(96, 90, 104) : rgb(60, 58, 66), radius: 4, outline: { color: rgb(40, 38, 46), width: 2 } });
      if (live) for (let i = 0; i < 3; i++)   // little ore gleams
        drawRect({ pos: vec2(o.gx * TILE + 8 + i * 7, ORIGIN_Y + o.gy * TILE + 12 + (i % 2) * 8), width: 4, height: 4,
                   color: rgb(150, 200, 230), radius: 1, opacity: 0.9 });
      if (live) drawRect({ pos: vec2(o.gx * TILE + 1, ORIGIN_Y + o.gy * TILE + 1), width: TILE - 2, height: TILE - 2,
                 color: rgb(0, 0, 0), opacity: 0, outline: { color: rgb(255, 255, 255), width: p * 2 }, radius: 4 });
      drawText({ text: live ? "Ore x" + ore : "spent (" + daysLeft + "d)", pos: vec2(cx(o.gx), ORIGIN_Y + o.gy * TILE + TILE + 1),
                 size: 8, anchor: "center", width: TILE * 2.6, color: live ? rgb(210, 225, 240) : rgb(150, 150, 165) });
      continue;
    }

    if (o.planterSlot !== undefined) {
      const pl = state.planters[o.planterSlot];
      // soil bed (sprite if supplied, else a brown rect)
      if (ready("planter")) drawSprite({ sprite: "planter", anchor: "bot",
        pos: vec2(cx(o.gx), ORIGIN_Y + (o.gy + 1) * TILE), width: PROP_DRAW, height: PROP_DRAW });
      else drawRect({ pos: vec2(o.gx * TILE + 3, ORIGIN_Y + o.gy * TILE + 9), width: TILE - 6, height: TILE - 12,
                 color: rgb(82, 60, 44), radius: 3, outline: { color: rgb(54, 38, 28), width: 1 } });
      let label = "Planter", actionable = true, ideal = false;
      if (pl) {
        const age = state.dayCount - pl.plantedDay, ripe = age >= GROW_DAYS;
        actionable = ripe;
        ideal = ripe && isIdealMoon(pl.herbId);
        // growth stages: tiny seedling -> bigger seedling -> ripe herb plant
        let spr, sz;
        if (ripe)                 { spr = herbSprite(pl.herbId); sz = PROP_DRAW; }
        else if (age >= GROW_DAYS / 2 && ready("seedling2")) { spr = "seedling2"; sz = 30; }
        else if (ready("seedling")) { spr = "seedling"; sz = 24; }
        else { spr = herbSprite(pl.herbId); sz = 18 + Math.min(age, GROW_DAYS) * 5; }
        // sit the plant in the soil (the planter box is taller than the tile),
        // not on its front rim
        if (ready(spr)) drawSprite({ sprite: spr, anchor: "bot",
          pos: vec2(cx(o.gx), ORIGIN_Y + (o.gy + 1) * TILE - 18), width: sz, height: sz, opacity: ripe ? 1 : 0.95 });
        label = ripe ? ITEMS[pl.herbId].name + " ready!" : ITEMS[pl.herbId].name + " (" + (GROW_DAYS - age) + "d)";
      }
      if (actionable) drawRect({ pos: vec2(o.gx * TILE + 1, ORIGIN_Y + o.gy * TILE + 1), width: TILE - 2, height: TILE - 2,
        color: rgb(0, 0, 0), opacity: 0, outline: { color: ideal ? rgb(255, 240, 170) : rgb(255, 255, 255), width: p * 2 }, radius: 4 });
      drawText({ text: label, pos: vec2(cx(o.gx), ORIGIN_Y + o.gy * TILE + TILE + 1), size: 8, anchor: "center",
        width: TILE * 2.6, color: ideal ? rgb(255, 240, 170) : (pl ? rgb(230, 225, 245) : rgb(180, 165, 140)) });
      continue;
    }

    // greenhouse pots (o.herbId) show ripe vs regrowing, with stock + moon cue
    const isPot = !!o.herbId;
    let ripe = true, stock = 0, daysLeft = 0, ideal = false;
    if (isPot) {
      refreshPot(o.herbId);
      const pot = state.pots[o.herbId];
      stock = pot ? pot.stock : 0;
      ripe = stock > 0;
      daysLeft = pot ? Math.max(0, pot.readyDay - state.dayCount) : 0;
      ideal = ripe && isIdealMoon(o.herbId);
    }
    const sprKey = isPot ? (ripe ? herbSprite(o.herbId) : "pots") : o.kind;
    if (ready(sprKey)) {
      // NPCs render as tall characters (player height); props/pots near-native.
      const isChar = CHAR_KINDS.has(o.kind);
      const w = isChar ? PLAYER_H * PLAYER_AR : PROP_DRAW;
      const h = isChar ? PLAYER_H : PROP_DRAW;
      drawSprite({
        sprite: sprKey, anchor: "bot",
        pos: vec2(cx(o.gx), ORIGIN_Y + (o.gy + 1) * TILE),
        width: w, height: h, opacity: (isPot && !ripe) ? 0.55 : 1,
      });
      // tappable halo only when actionable (pots only when ripe)
      if (!isPot || ripe) {
        drawRect({ pos: vec2(o.gx * TILE + 1, ORIGIN_Y + o.gy * TILE + 1), width: TILE - 2, height: TILE - 2,
                   color: rgb(0, 0, 0), opacity: 0,
                   outline: { color: ideal ? rgb(255, 240, 170) : rgb(255, 255, 255), width: p * 2 }, radius: 4 });
      }
    } else {
      drawRect({
        pos: vec2(o.gx * TILE + 4, ORIGIN_Y + o.gy * TILE + 4),
        width: TILE - 8, height: TILE - 8,
        color: col(o.color),
        outline: { color: rgb(255, 255, 255), width: 1 + p * 2 },
        radius: 4,
      });
    }
    let label = o.name;
    if (isPot) label = ripe ? o.name + " x" + stock + (ideal ? " (ideal!)" : "")
                            : o.name + " (" + daysLeft + "d)";
    drawText({
      text: label, pos: vec2(cx(o.gx), ORIGIN_Y + o.gy * TILE + TILE + 1),
      size: 8, anchor: "center", width: TILE * 2.6,
      color: (isPot && !ripe) ? rgb(150, 150, 165) : (ideal ? rgb(255, 240, 170) : rgb(230, 225, 245)),
    });
  }

  // --- player (sprite if supplied, else placeholder rect + facing nub) ---
  // Drawn ~1.4 tiles tall and bottom-anchored so the feet rest on the tile
  // (cozy Stardew proportion) rather than shrunk to a single 32px square.
  // walking? cycle the directional walk frames; otherwise the idle rotation.
  const moving = path && path.length > 0;
  let pKey = null;
  const nFrames = PLAYER_WALK[player.dir] || 0;
  if (moving && nFrames > 0) {
    const wf = "player_" + player.dir + "_w" + (Math.floor(time() * WALK_FPS) % nFrames);
    if (ready(wf)) pKey = wf;
  }
  if (!pKey) pKey = ready("player_" + player.dir) ? "player_" + player.dir : (ready("player") ? "player" : null);
  if (pKey) {
    drawSprite({
      sprite: pKey, anchor: "bot",
      pos: vec2(player.px, player.py + TILE * 0.42),
      width: PLAYER_H * PLAYER_AR, height: PLAYER_H,
    });
  } else {
    drawRect({
      pos: vec2(player.px, player.py), width: 22, height: 22,
      color: rgb(255, 210, 120), anchor: "center", radius: 4,
      outline: { color: rgb(120, 80, 30), width: 2 },
    });
    const nub = { up: [0, -9], down: [0, 9], left: [-9, 0], right: [9, 0] }[player.dir];
    drawRect({
      pos: vec2(player.px + nub[0], player.py + nub[1]), width: 7, height: 7,
      color: rgb(120, 80, 30), anchor: "center", radius: 2,
    });
  }

  drawHUD(r);
  if (brewUI)         drawBrew();
  if (journalOpen)    drawJournal();
  if (shopOpen)       drawShop();
  if (plantMenu)      drawPlantMenu();
  if (encounter)      drawEncounter();
  if (bagOpen)        drawBag();
  if (meditating)     drawMeditate();
  if (decorating)     drawDecorate();
  if (dialogue)       drawDialogue();
  else if (toastMsg && !brewUI && !journalOpen && !shopOpen && !plantMenu) drawToast();
  if (nightSummary)   drawNight();
  if (showTimetable)  drawTimetable();
  if (introLetter)    drawLetter();
});

/* ---------- Merchant shop overlay ---------- */
function shopRows() {
  const shop = SHOPS[shopOpen] || SHOPS.general;
  const rows = [], x = 22, w = CANVAS_W - 44, H = 21; let y = 96;
  const push = (o) => { o.x = x; o.y = y; o.w = w; o.h = H; rows.push(o); y += H; };
  // seed packets (for studied herbs)
  if (shop.seeds) {
    push({ type: "hdr", label: "Buy seeds  (" + SEED_COST + "c each)" });
    let any = false;
    for (const id of HERB_ORDER) {
      if (!state.herbsKnown[id]) continue; any = true;
      push({ type: "seed", id, label: ITEMS[id].name + " seed", sub: "have " + (state.seeds[id] || 0), price: SEED_COST });
    }
    if (!any) push({ type: "note", label: "(study herbs to unlock their seeds)" });
    y += 6;
  }
  // fixed goods (paginated when the list is long, e.g. Furnishings)
  if (shop.buy && shop.buy.length) {
    const per = 14, pages = Math.ceil(shop.buy.length / per);
    const pg = shopPage = Math.max(0, Math.min(shopPage, pages - 1));
    push({ type: "hdr", label: "Buy" + (pages > 1 ? "  (page " + (pg + 1) + "/" + pages + ")" : "") });
    for (const id of shop.buy.slice(pg * per, pg * per + per)) {
      const owned = ITEMS[id].kind === "furniture" ? (state.furniture[id] || 0) : (state.inv[id] || 0);
      push({ type: "buy", id, label: ITEMS[id].name, sub: "own " + owned, price: buyCost(id) });
    }
    if (pages > 1) {
      rows.push({ type: "prev", x, y, w: w / 2 - 4, h: H });
      rows.push({ type: "next", x: x + w / 2 + 4, y, w: w / 2 - 4, h: H });
      y += H;
    }
    y += 6;
  }
  // selling
  if (shop.sellKinds && shop.sellKinds.length) {
    push({ type: "hdr", label: "Sell" });
    const sellable = Object.keys(state.inv).filter((id) => state.inv[id] > 0 && ITEMS[id] && shop.sellKinds.includes(ITEMS[id].kind));
    if (!sellable.length) push({ type: "note", label: "(nothing they'll buy)" });
    for (const id of sellable) push({ type: "sell", id, label: ITEMS[id].name + " x" + state.inv[id], price: ITEMS[id].sell != null ? ITEMS[id].sell : HERB_SELL });
    y += 8;
  }
  push({ type: "close", label: "Close" });
  return rows;
}
function drawShop() {
  const shop = SHOPS[shopOpen] || SHOPS.general;
  drawRect({ pos: vec2(0, 0), width: CANVAS_W, height: CANVAS_H, color: rgb(8, 6, 14), opacity: 0.86 });

  for (const b of shopRows()) {
    if (b.type === "hdr") {
      drawText({ text: b.label, pos: vec2(b.x, b.y + 4), size: 12, color: rgb(190, 175, 220) });
    } else if (b.type === "note") {

      } else if (isNav) {
        drawText({ text: b.type === "prev" ? "< Prev" : "Next >", pos: vec2(b.x + b.w / 2, b.y + 5), size: 12, color: rgb(220, 220, 235), anchor: "center" });

        drawText({ text: (isBuy ? "-" : "+") + b.price + "c", pos: vec2(b.x + b.w - 8, b.y + 5), size: 11, color: accent, anchor: "right" });
      }
    }
  }
}
function handleShopTap(m) {
  for (const b of shopRows()) {
    if (!pointIn(m, b)) continue;
    if (b.type === "close") shopOpen = false;
    else if (b.type === "prev") shopPage = Math.max(0, shopPage - 1);
    else if (b.type === "next") shopPage += 1;
    else if (b.type === "seed") buySeed(b.id);
    else if (b.type === "buy") buyItem(b.id);
    else if (b.type === "sell") sellItem(b.id);
    return;
  }
}

/* ---------- Dorm decorating mode ----------
   Bottom palette of owned furniture (paged). Tap a chip to select a piece,
   then tap a tile to place it. Tap a placed piece to select it, then Rotate /
   Remove it, or tap another tile to move it. Floor pieces go on open floor;
   wall hangings go on a wall tile. Cosmetic — nothing blocks walking.        */
function decorOwned() {
  return DECOR_ORDER.filter((id) => (state.furniture[id] || 0) > 0);
}
const DECOR_PER = 7;
function decorRows() {
  const rows = [], band = CANVAS_H - 64;
  // control row (right-aligned buttons): Done always; Rotate/Remove when a
  // placed piece is selected
  rows.push({ type: "done", x: CANVAS_W - 46, y: band + 3, w: 42, h: 15 });
  if (decorating.pick != null) {
    rows.push({ type: "rotate", x: CANVAS_W - 96, y: band + 3, w: 46, h: 15 });
    rows.push({ type: "remove", x: CANVAS_W - 150, y: band + 3, w: 50, h: 15 });
  }
  // palette: page arrows + owned chips for the current page
  const owned = decorOwned(), pages = Math.max(1, Math.ceil(owned.length / DECOR_PER));
  decorating.page = Math.max(0, Math.min(decorating.page || 0, pages - 1));
  if (pages > 1) {
    rows.push({ type: "pprev", x: 4, y: band + 22, w: 18, h: 38 });
    rows.push({ type: "pnext", x: CANVAS_W - 22, y: band + 22, w: 18, h: 38 });
  }
  let x = pages > 1 ? 26 : 8;
  for (const id of owned.slice(decorating.page * DECOR_PER, decorating.page * DECOR_PER + DECOR_PER)) {
    rows.push({ type: "chip", id, x, y: band + 22, w: 40, h: 38 });
    x += 46;
  }
  return rows;
}
function drawDecorate() {
  const band = CANVAS_H - 64;
  // lore tooltip for the focused piece (floats just above the palette band)
  const focus = decorating.pick != null ? (state.dormDecor[decorating.pick] || {}).id : decorating.sel;
  if (focus && ITEMS[focus] && ITEMS[focus].lore) {
    drawRect({ pos: vec2(0, band - 30), width: CANVAS_W, height: 30, color: rgb(20, 16, 30), opacity: 0.92 });
    drawText({ text: ITEMS[focus].name + " — " + ITEMS[focus].lore, pos: vec2(6, band - 27), size: 9,
               color: rgb(220, 214, 240), width: CANVAS_W - 12 });
  }
  drawRect({ pos: vec2(0, band), width: CANVAS_W, height: 64, color: rgb(30, 24, 44) });
  // instruction line (left of the control buttons)
  let tip;
  if (decorating.pick != null) {
    const o = state.dormDecor[decorating.pick];
    tip = "Selected " + (ITEMS[o.id] ? ITEMS[o.id].name : "piece") + " — Rotate / Remove, or tap a tile to move it.";
  } else if (decorating.sel) {
    tip = "Placing " + ITEMS[decorating.sel].name + " — tap " + (ITEMS[decorating.sel].wall ? "a wall" : "an open floor") + " tile.";
  } else {
    tip = "Tap a piece, then a tile. Tap a placed piece to edit it.";
  }
  drawText({ text: tip, pos: vec2(6, band + 5), size: 9, color: rgb(225, 216, 244), width: CANVAS_W - 158 });
  if (!decorOwned().length) {
    drawText({ text: "No furniture yet — buy some at the Furnishings shop (Market Street).",
               pos: vec2(6, band + 30), size: 10, color: rgb(180, 170, 200), width: CANVAS_W - 16 });
  }
  const labels = { done: "Done", rotate: "Rotate", remove: "Remove", pprev: "<", pnext: ">" };
  for (const b of decorRows()) {
    if (b.type === "chip") {
      const it = ITEMS[b.id], seld = decorating.sel === b.id;
      drawRect({ pos: vec2(b.x, b.y), width: b.w, height: b.h, color: rgb(44, 36, 58), radius: 5,
                 outline: { color: seld ? rgb(255, 210, 130) : rgb(90, 78, 110), width: seld ? 2 : 1 } });
      if (ready(it.sprite)) drawSprite({ sprite: it.sprite, anchor: "center", pos: vec2(b.x + b.w / 2, b.y + 15), width: 22, height: 22 });
      else drawRect({ pos: vec2(b.x + b.w / 2, b.y + 15), width: 16, height: 16, anchor: "center", color: col(it.color), radius: 3 });
      drawText({ text: "x" + state.furniture[b.id], pos: vec2(b.x + b.w / 2, b.y + 28), size: 9, color: rgb(225, 222, 235), anchor: "center" });
    } else {
      const accent = b.type === "remove" ? rgb(220, 150, 150) : rgb(180, 150, 210);
      drawRect({ pos: vec2(b.x, b.y), width: b.w, height: b.h, color: rgb(58, 48, 74), radius: 4, outline: { color: accent, width: 1 } });
      drawText({ text: labels[b.type], pos: vec2(b.x + b.w / 2, b.y + 3), size: b.type.startsWith("p") ? 12 : 10,
                 color: rgb(232, 224, 248), anchor: "center" });
    }
  }
}
function handleDecorateTap(m) {
  // panel buttons take priority over the room
  for (const b of decorRows()) {
    if (!pointIn(m, b)) continue;
    if (b.type === "done") { decorating = null; save(); }
    else if (b.type === "pprev") decorating.page = Math.max(0, (decorating.page || 0) - 1);
    else if (b.type === "pnext") decorating.page = (decorating.page || 0) + 1;
    else if (b.type === "chip") { decorating.sel = (decorating.sel === b.id ? null : b.id); decorating.pick = null; }
    else if (b.type === "rotate" && decorating.pick != null) {
      const o = state.dormDecor[decorating.pick]; o.rot = ((o.rot || 0) + 1) % 4; save();
    } else if (b.type === "remove" && decorating.pick != null) {
      const o = state.dormDecor[decorating.pick];
      state.furniture[o.id] = (state.furniture[o.id] || 0) + 1;
      state.dormDecor.splice(decorating.pick, 1);
      decorating.pick = null; toast("Picked up"); save();
    }
    return;
  }
  // taps on the grid (above the palette band)
  if (m.y < ORIGIN_Y || m.y >= CANVAS_H - 64) return;
  const gx = Math.floor(m.x / TILE), gy = Math.floor((m.y - ORIGIN_Y) / TILE);
  if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return;
  const r = ROOMS.dorm;
  const hit = (state.dormDecor || []).findIndex((d) => d.gx === gx && d.gy === gy);
  // tapped another placed piece -> select it for editing
  if (hit >= 0 && hit !== decorating.pick) { decorating.pick = hit; decorating.sel = null; return; }
  if (hit >= 0) return;                              // tapped the selected piece's own tile
  // empty tile: move the selected placed piece, else place a new one
  if (decorating.pick != null) {
    const o = state.dormDecor[decorating.pick];
    if (!validDecorTile(r, gx, gy, ITEMS[o.id], decorating.pick)) { toast("Can't place there"); return; }
    o.gx = gx; o.gy = gy; save(); return;
  }
  const id = decorating.sel;
  if (!id || (state.furniture[id] || 0) <= 0) return;
  if (!validDecorTile(r, gx, gy, ITEMS[id], -1)) { toast("Can't place there"); return; }
  const it = ITEMS[id];
  state.dormDecor.push({ id, sprite: it.sprite, gx, gy, flat: !!it.flat, wall: !!it.wall, rot: 0 });
  state.furniture[id] -= 1;
  if (state.furniture[id] <= 0) { delete state.furniture[id]; if (decorating.sel === id) decorating.sel = null; }
  save();
}
// Is (gx,gy) a legal home for this furniture? Wall hangings need a wall tile
// (not a door); floor pieces need open floor (no wall/door/inter/built-in
// decor). Either way the tile must be free of other placed pieces.
function validDecorTile(r, gx, gy, it, selfIdx) {
  const occ = (state.dormDecor || []).findIndex((d) => d.gx === gx && d.gy === gy);
  if (occ >= 0 && occ !== selfIdx) return false;
  const isWall = r.grid[gy][gx] === "#";
  if (it && it.wall) return isWall && !doorAt(r, gx, gy);
  if (isWall || doorAt(r, gx, gy) || interAt(r, gx, gy) || decorAt(r, gx, gy)) return false;
  return true;
}
// Draw one placed dorm piece (sprite if we have art, else a tidy placeholder),
// with rotation; in Decorate mode add a selection outline + a small label.
function drawPlacedDecor(o, idx) {
  const it = ITEMS[o.id] || {}, flat = it.flat, wall = it.wall, ang = (o.rot || 0) * 90;
  const cxp = cx(o.gx), cyp = ORIGIN_Y + o.gy * TILE + TILE / 2;
  if (ready(o.sprite)) {
    if (flat)      drawSprite({ sprite: o.sprite, anchor: "center", pos: vec2(cxp, cy(o.gy)), width: PROP_DRAW, height: PROP_DRAW, angle: ang });
    else if (wall) drawSprite({ sprite: o.sprite, anchor: "center", pos: vec2(cxp, cyp), width: 26, height: 26, angle: ang });
    else           drawSprite({ sprite: o.sprite, anchor: "bot", pos: vec2(cxp, ORIGIN_Y + (o.gy + 1) * TILE), width: PROP_DRAW, height: PROP_DRAW, angle: ang });
  } else {
    // placeholder shapes until PixelLab art is dropped in under o.sprite
    const odd = (o.rot || 0) % 2 === 1;
    if (flat) {
      drawRect({ pos: vec2(cxp, cy(o.gy)), anchor: "center", width: odd ? 16 : 30, height: odd ? 30 : 16,
                 color: col(it.color), radius: 4, outline: { color: col(it.color, 0.6), width: 2 } });
    } else if (wall) {
      drawRect({ pos: vec2(cxp, cyp - 12), anchor: "center", width: 3, height: 4, color: rgb(60, 54, 50) });
      drawRect({ pos: vec2(cxp, cyp), anchor: "center", width: 22, height: 22, color: col(it.color), radius: 3,
                 outline: { color: rgb(40, 34, 30), width: 2 } });
    } else {
      drawRect({ pos: vec2(cxp, ORIGIN_Y + (o.gy + 1) * TILE - 3), anchor: "bot", width: 18, height: 26,
                 color: col(it.color), radius: 4, outline: { color: col(it.color, 0.6), width: 2 } });
    }
  }
  if (decorating) {
    const picked = decorating.pick === idx;
    drawRect({ pos: vec2(o.gx * TILE + 1, ORIGIN_Y + o.gy * TILE + 1), width: TILE - 2, height: TILE - 2,
               color: rgb(0, 0, 0), opacity: 0,
               outline: { color: picked ? rgb(255, 220, 130) : rgb(200, 190, 220), width: picked ? 2 + pulse() * 2 : 1 }, radius: 4 });
    drawText({ text: it.name || "", pos: vec2(cxp, ORIGIN_Y + o.gy * TILE + TILE - 1), size: 7, anchor: "center",
               width: TILE * 2.4, color: rgb(235, 228, 248) });
  }
}

/* ---------- Mine creature encounter (defensive choices, no combat) ---------- */
function encounterRows() {
  const rows = [], x = 28, w = CANVAS_W - 56, H = 28; let y = 248;
  for (const a of APPROACHES) {
    if (!approachAvailable(a)) continue;   // item-gated: only if you carry it

    rows.push({ x, y, w, h: H, id: a.id, label: a.label + (a.magic ? "  (-" + SPELL_COST + " en)" : ""), magic: a.magic, disabled }); y += H + 5;

}
function drawEncounter() {

  } else {
    drawRect({ pos: vec2(CANVAS_W / 2, 120), width: 84, height: 84, anchor: "center", color: col(c.color), radius: 8,

             pos: vec2(CANVAS_W / 2, 222), size: 10, color: rgb(170, 170, 190), anchor: "center", width: CANVAS_W - 50 });

             color: rgb(200, 190, 170), anchor: "center" });
  for (const b of encounterRows()) {
    const retreat = b.id === "retreat";
    const hint = known && b.id === c.calmWith && !b.disabled;   // highlight the studied response
    const oc = b.disabled ? rgb(90, 80, 90) : (hint ? rgb(150, 220, 150) : (retreat ? rgb(150, 130, 200) : rgb(120, 180, 160)));
    drawRect({ pos: vec2(b.x, b.y), width: b.w, height: b.h, color: hint ? rgb(58, 70, 56) : rgb(46, 40, 58),
               opacity: b.disabled ? 0.5 : 1, radius: 6, outline: { color: oc, width: hint ? 2 : 1 } });

               color: b.disabled ? rgb(150, 145, 155) : (hint ? rgb(220, 245, 220) : rgb(225, 225, 240)), anchor: "left" });
  }
}
function handleEncounterTap(m) {
  for (const b of encounterRows()) { if (pointIn(m, b) && !b.disabled) { resolveEncounter(b.id); return; } }
}

/* ---------- Bag: eat / drink / meditate ---------- */
function useConsumable(id) {
  const r = ITEMS[id].restore || {};
  if (r.health) state.health = Math.min(HP_MAX, state.health + r.health);
  if (r.energy) state.energy = Math.min(EN_MAX, state.energy + r.energy);
  state.inv[id] -= 1;
  const verb = ITEMS[id].kind === "remedy" ? "Drank" : "Ate";
  toast(verb + " " + ITEMS[id].name + " (" + (r.health ? "+" + r.health + " HP" : "+" + r.energy + " EN") + ").");
  save();
}
function bagRows() {
  const rows = [], x = 22, w = CANVAS_W - 44, H = 24; let y = 120;
  const push = (o) => { o.x = x; o.y = y; o.w = w; o.h = H; rows.push(o); y += H + 4; };
  push({ type: "hdr", label: "Eat / Drink" });
  const consumables = Object.keys(state.inv).filter((id) => state.inv[id] > 0 && ITEMS[id] && ITEMS[id].restore);
  if (!consumables.length) push({ type: "note", label: "(no food or remedies — buy some in the village)" });
  for (const id of consumables) {
    const r = ITEMS[id].restore;
    push({ type: "use", id, label: ITEMS[id].name + "  x" + state.inv[id], gain: r.health ? "+" + r.health + " HP" : "+" + r.energy + " EN" });
  }
  y += 8;
  push({ type: "meditate", label: "Meditate — ground & draw energy from the earth" });
  y += 4;
  push({ type: "close", label: "Close" });
  return rows;
}
function drawBag() {
  drawRect({ pos: vec2(0, 0), width: CANVAS_W, height: CANVAS_H, color: rgb(8, 6, 14), opacity: 0.86 });
  drawRect({ pos: vec2(14, 44), width: CANVAS_W - 28, height: CANVAS_H - 80, color: rgb(34, 28, 44), radius: 10, outline: { color: rgb(150, 120, 60), width: 2 } });
  drawText({ text: "Bag", pos: vec2(CANVAS_W / 2, 58), size: 16, color: rgb(255, 225, 150), anchor: "center" });
  drawText({ text: "Health " + state.health + " / " + HP_MAX + "    Energy " + state.energy + " / " + EN_MAX,
             pos: vec2(CANVAS_W / 2, 80), size: 11, color: rgb(230, 220, 200), anchor: "center" });
  for (const b of bagRows()) {
    if (b.type === "hdr") { drawText({ text: b.label, pos: vec2(b.x, b.y + 4), size: 12, color: rgb(190, 175, 220) }); continue; }
    if (b.type === "note") { drawText({ text: b.label, pos: vec2(b.x + 6, b.y + 4), size: 10, color: rgb(150, 150, 170) }); continue; }
    const accent = b.type === "close" ? rgb(150, 130, 200) : (b.type === "meditate" ? rgb(140, 200, 160) : rgb(180, 200, 130));
    drawRect({ pos: vec2(b.x, b.y), width: b.w, height: b.h, color: rgb(46, 40, 58), radius: 6, outline: { color: accent, width: 1 } });
    if (b.type === "close" || b.type === "meditate") {
      drawText({ text: b.label, pos: vec2(b.x + b.w / 2, b.y + b.h / 2), size: 12, color: rgb(225, 225, 240), anchor: "center" });
    } else {
      drawText({ text: b.label, pos: vec2(b.x + 8, b.y + b.h / 2), size: 11, color: rgb(225, 225, 240), anchor: "left" });
      drawText({ text: b.gain, pos: vec2(b.x + b.w - 8, b.y + b.h / 2), size: 11, color: accent, anchor: "right" });
    }
  }
}
function handleBagTap(m) {
  for (const b of bagRows()) {
    if (!pointIn(m, b)) continue;
    if (b.type === "close") bagOpen = false;
    else if (b.type === "use") useConsumable(b.id);
    else if (b.type === "meditate") { bagOpen = false; meditating = { start: time(), from: state.energy }; }
    return;
  }
}
function drawMeditate() {
  const t = Math.min(1, (time() - meditating.start) / MEDITATE_SECS);
  state.energy = Math.min(EN_MAX, Math.round(meditating.from + MEDITATE_GAIN * t));
  drawRect({ pos: vec2(0, 0), width: CANVAS_W, height: CANVAS_H, color: rgb(8, 10, 16), opacity: 0.9 });
  drawText({ text: "Meditating...", pos: vec2(CANVAS_W / 2, CANVAS_H / 2 - 40), size: 16, color: rgb(200, 220, 255), anchor: "center" });
  drawText({ text: "Drawing energy up from the earth.", pos: vec2(CANVAS_W / 2, CANVAS_H / 2 - 16), size: 11, color: rgb(170, 185, 210), anchor: "center" });
  const bw = 200, bx = CANVAS_W / 2 - bw / 2, by = CANVAS_H / 2 + 10;
  drawRect({ pos: vec2(bx, by), width: bw, height: 10, color: rgb(28, 34, 42), radius: 5 });
  drawRect({ pos: vec2(bx, by), width: bw * t, height: 10, color: rgb(90, 170, 220), radius: 5 });
  if (t >= 1) { meditating = null; toast("You feel renewed."); save(); }
}

/* ---------- Field journal: a parchment page of studies + takeaways ---------- */
// The Book of Shadows is paged: page 0 is the studies overview, then one
// illustrated page per studied herb (in HERB_ORDER). Prev/Next/Close buttons.
function bosHerbPages() { return HERB_ORDER.filter((h) => state.herbsKnown[h]); }
function bosCrystalPages() { return CRYSTAL_ORDER.filter((c) => state.crystalsKnown[c]); }
function bosCreaturePages() { return CREATURE_ORDER.filter((c) => state.creaturesKnown[c]); }
function bosTotalPages() { return 1 + bosHerbPages().length + bosCrystalPages().length + bosCreaturePages().length; }
function bosButtons() {
  const y = CANVAS_H - 90, h = 26;
  return [
    { id: "prev",  x: 22,             y, w: 74, h, label: "< Prev" },
    { id: "close", x: CANVAS_W / 2 - 37, y, w: 74, h, label: "Close" },
    { id: "next",  x: CANVAS_W - 96,  y, w: 74, h, label: "Next >" },
  ];
}
function handleBosTap(m) {
  if (bosPage === 0 && pointIn(m, resetBtn())) {     // reset (two-tap confirm)
    if (resetArmed) resetGame(); else resetArmed = true;
    return;
  }
  for (const b of bosButtons()) {
    if (!pointIn(m, b)) continue;
    resetArmed = false;                              // any nav cancels a pending reset
    if (b.id === "close") journalOpen = false;
    else if (b.id === "prev") bosPage = Math.max(0, bosPage - 1);
    else if (b.id === "next") bosPage = Math.min(bosTotalPages() - 1, bosPage + 1);
    return;
  }
}

function drawJournal() {                       // (the Book of Shadows)
  drawRect({ pos: vec2(0, 0), width: CANVAS_W, height: CANVAS_H, color: rgb(8, 6, 14), opacity: 0.6 });
  const bx = 12, by = 40, bw = CANVAS_W - 24, bh = CANVAS_H - 110;
  drawRect({ pos: vec2(bx, by), width: bw, height: bh, color: rgb(58, 34, 30), radius: 12,
             outline: { color: rgb(150, 120, 60), width: 3 } });
  const px = bx + 12, py = by + 12, pw = bw - 24, ph = bh - 24;
  drawRect({ pos: vec2(px, py), width: pw, height: ph, color: rgb(236, 224, 194), radius: 4 });

  const herbs = bosHerbPages(), crystals = bosCrystalPages(), creatures = bosCreaturePages();
  if (bosPage > bosTotalPages() - 1) bosPage = bosTotalPages() - 1;
  const i = bosPage - 1;
  if (bosPage === 0) drawBosOverview(px, py, pw, ph);
  else if (i < herbs.length) drawHerbPage(herbs[i], px, py, pw, ph);
  else if (i - herbs.length < crystals.length) drawCrystalPage(crystals[i - herbs.length], px, py, pw, ph);
  else drawCreaturePage(creatures[i - herbs.length - crystals.length], px, py, pw, ph);

  // page buttons
  for (const b of bosButtons()) {
    const on = (b.id === "prev" && bosPage > 0) || (b.id === "next" && bosPage < bosTotalPages() - 1) || b.id === "close";
    drawRect({ pos: vec2(b.x, b.y), width: b.w, height: b.h, radius: 6,
               color: on ? rgb(176, 150, 200) : rgb(90, 80, 96), opacity: on ? 1 : 0.5,
               outline: { color: rgb(120, 95, 150), width: 1 } });
    drawText({ text: b.label, pos: vec2(b.x + b.w / 2, b.y + b.h / 2), size: 11, font: hf(),
               color: rgb(30, 22, 38), anchor: "center" });
  }
  drawText({ text: "Page " + (bosPage + 1) + " / " + bosTotalPages(), pos: vec2(CANVAS_W / 2, CANVAS_H - 50),
             size: 10, font: hf(), color: rgb(210, 200, 225), anchor: "center" });
}
